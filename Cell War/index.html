<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   DRIFT LOCK
   Entry Point — Document Structure & Screen Flow

   Screens:  Menu → Room / Options / About
  ═══════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="DRIFT LOCK — two wells, one signal. A REDUPLINK game.">
    <title>DRIFT LOCK · REDUPLINK</title>
    <script>
        (function () {
            var KEYS = ["spacejunkStudioTint", "nebulaVoidHubTitleColor", "cosmic-quiz-signal"];
            function isHex(value) {
                return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
            }
            try {
                for (var i = 0; i < KEYS.length; i++) {
                    var saved = localStorage.getItem(KEYS[i]);
                    if (saved && isHex(saved)) {
                        document.documentElement.style.setProperty("--sj-signal", saved.toLowerCase());
                        break;
                    }
                }
            } catch (err) { /* storage unavailable */ }
            var shortSide = Math.min(window.innerWidth, window.innerHeight);
            var ua = navigator.userAgent || "";
            var iPad = /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var androidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
            var fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
            var coarse = window.matchMedia("(pointer: coarse)").matches;
            var noHover = window.matchMedia("(hover: none)").matches;
            var tablet = shortSide >= 600 && (iPad || androidTablet || (!fine && (coarse || noHover) && navigator.maxTouchPoints > 0));
            if (tablet) {
                document.documentElement.classList.add("tablet-mode");
                var viewport = document.querySelector('meta[name="viewport"]');
                if (viewport) viewport.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
            }
        })();
    </script>

    <!-- Styles & Typography -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Press+Start+2P&family=Rubik+Mono+One&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="drift-field" aria-hidden="true"></canvas>

    <!-- ────────────────────────────────────────────────────────────────────
         SCREEN: Main Menu — Nickname & navigation
         ──────────────────────────────────────────────────────────────────── -->
    <section id="screen-menu" class="screen active">
        <div class="menu-box drift-start">
            <h1 class="drift-title"><span>DRIFT</span><span>LOCK</span></h1>
            <div class="drift-actions">
            <input id="nick-input" type="text" maxlength="12" placeholder="NAME" autocomplete="off">
            <button id="btn-play" class="btn-play">START</button>
            <button id="btn-options" class="btn-secondary" type="button">OPTIONS</button>
            <button id="btn-about" class="btn-secondary" type="button">ABOUT</button>
            <div class="sj-mark sj-mark--menu" role="img" aria-label="Reduplink Games">
                <p class="sj-mark-name">REDUPLINK GAMES</p>
                <button type="button" class="sj-tint" id="btn-signal-tint" aria-label="Signal tint">
                <svg class="sj-mark-ru" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <g class="sj-mark-ru-hud">
                        <rect class="sj-mark-ru-frame" x="2.25" y="2.25" width="19.5" height="19.5" rx="4.5" ry="4.5"
                              fill="none" stroke="var(--sj-signal)" stroke-width="1.2" stroke-linejoin="round"/>
                        <text class="sj-mark-ru-letters" x="12" y="15.65" text-anchor="middle"
                              font-family="'Courier New', Courier, monospace" font-size="10.2" font-weight="700"
                              letter-spacing="-0.04em" fill="var(--sj-signal)">RU</text>
                    </g>
                </svg>
                </button>
            </div>
            </div>
        </div>
    </section>

    <!-- ────────────────────────────────────────────────────────────────────
         SCREEN: Options — Gameplay, audio & display settings
         ──────────────────────────────────────────────────────────────────── -->
    <section id="screen-options" class="screen" inert>
        <div class="drift-actions">
            <button id="opt-sound" class="btn-secondary opt-toggle" type="button" aria-pressed="true">SOUND</button>
            <button id="opt-fullscreen" class="btn-secondary opt-toggle" type="button" aria-pressed="false">FULL SCREEN</button>
            <button id="btn-back-menu" class="btn-secondary" type="button">BACK</button>
        </div>
    </section>

    <section id="screen-about" class="screen" inert>
        <div class="drift-actions">
            <button id="btn-about-back" class="btn-secondary" type="button">BACK</button>
        </div>
    </section>

    <section id="screen-room" class="screen" inert>
        <div class="drift-actions drift-room">
            <p id="room-name" class="drift-room-name"></p>
            <div id="room-idle" class="drift-room-idle">
                <button id="btn-room-create" class="btn-play" type="button">CREATE</button>
                <input id="room-code-input" type="text" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false">
                <button id="btn-room-join" class="btn-secondary" type="button">JOIN</button>
            </div>
            <div id="room-wait" hidden>
                <p id="room-code" class="drift-room-code"></p>
                <p class="drift-room-wait">WAITING</p>
            </div>
            <button id="btn-room-back" class="btn-secondary" type="button">BACK</button>
        </div>
    </section>

    <!-- Scripts -->
    <script src="sounds.js"></script>
    <script src="script.js"></script>
</body>
</html>
