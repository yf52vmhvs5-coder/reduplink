name: Bug report
description: Something broken in the studio or a game
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Where
      options:
        - Studio (index)
        - Nebula Void
        - Cosmic Quiz
        - Cell Wars
        - Other / unclear
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Short description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 130 on Windows, Safari on iPhone
    validations:
      required: false
